name: Release TypeScript SDK

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          package-manager-cache: false
      - name: Verify tag targets public main
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || {
            echo "Release tag must target the current public main commit." >&2
            exit 1
          }
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node - <<'JS'
          const fs = require("node:fs");
          const tag = process.env.RELEASE_TAG;
          const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== `v${version}`) {
            throw new Error(`Tag ${tag} does not match TypeScript SDK version ${version}`);
          }
          JS
      - name: Build and verify
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          npm ci --no-audit --no-fund
          npm run codegen -- --snapshot-only
          npm run lint
          npm run typecheck
          npm test
          first_pack_dir="$(mktemp -d)"
          second_pack_dir="$(mktemp -d)"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$first_pack_dir" "$second_pack_dir" "$smoke_dir"' EXIT
          npm run build
          npm pack --pack-destination "$first_pack_dir"
          rm -rf dist
          npm run build
          npm pack --pack-destination "$second_pack_dir"
          diff -qr "$first_pack_dir" "$second_pack_dir"
          rm -rf dist
          mkdir dist
          mv "$first_pack_dir"/*.tgz dist/
          package_path=("$PWD"/dist/*.tgz)
          tarball="${package_path[0]}"
          npx --yes publint@0.3.22 "$tarball"
          # Node 10 predates exports maps; this package requires Node 22 or newer.
          npx --yes @arethetypeswrong/cli@0.18.5 --pack "$tarball" --profile node16
          npm install --prefix "$smoke_dir" --ignore-scripts --no-audit --no-fund "${package_path[0]}"
          (
            cd "$smoke_dir"
            node --input-type=module -e \
              'import { CrawlerClient, __version__ } from "@crimson-crawler/crimson-crawler-client"; if (typeof CrawlerClient !== "function" || !__version__) process.exit(1)'
            node -e \
              'const { CrawlerClient, __version__ } = require("@crimson-crawler/crimson-crawler-client"); if (typeof CrawlerClient !== "function" || !__version__) process.exit(1)'
          )
          python scripts/verify-public-artifacts.py --ts-only
      # Built from the tarball's own package metadata plus the committed lock, not by
      # scanning `dist/`. A scan of that directory sees opaque archives and emits an
      # empty inventory, which would have been attested as if it meant something.
      - name: Generate CycloneDX SBOM
        run: |
          python scripts/generate-public-sbom.py \
            --npm-tarball dist/*.tgz \
            --lock package-lock.json \
            --output SBOM.raw.cdx.json
      # Fails closed before anything is attested or published: rejects a missing or
      # malformed serialNumber, a scan-directory subject, an empty inventory, or a
      # missing declared runtime dependency.
      - name: Validate and normalize SBOM
        run: |
          python scripts/normalize-public-sbom.py SBOM.raw.cdx.json SBOM.cdx.json \
            --expect-component @crimson-crawler/crimson-crawler-client \
            --require-dependency undici
          for file in dist/* SBOM.cdx.json; do shasum -a 256 "$file"; done | sed 's#  .*/#  #' > SHA256SUMS
      # Retained briefly so a generator defect stays distinguishable from a normalizer
      # defect. Not a release asset — the validated SBOM.cdx.json is.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-raw-diagnostic
          path: SBOM.raw.cdx.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: SBOM.cdx.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  # ATTEST BEFORE PUBLISH. Attestation binds to the artifact digest, so it does not need
  # the package to exist on npm — and running it first means a failure here costs
  # nothing, whereas the previous order failed *after* an immutable upload had already
  # happened. An attestation for an artifact that never publishes is harmless; a
  # published artifact with no attestation cannot be fixed.
  attest:
    name: Attest package artifacts
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write # Sign the GitHub artifact attestation
      attestations: write # Publish the GitHub artifact attestation
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution
          path: distribution
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: distribution/*
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: distribution/*
          sbom-path: sbom/SBOM.cdx.json

  registry:
    name: Check public registry
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
      bootstrap: ${{ steps.registry.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution
          path: distribution
      - name: Check npm state
        id: registry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BOOTSTRAP_VERSION: ${{ vars.NPM_BOOTSTRAP_VERSION }}
        run: |
          # Decide the bootstrap-vs-OIDC branch ONCE, here, and export it. `publish` runs with
          # `environment: release`, and an environment-level variable shadows the repository one
          # of the same name — so re-reading `vars.NPM_BOOTSTRAP_VERSION` there can yield a
          # different value than this guard saw, which silently defeats the guard below. Deciding
          # once and passing the result through `needs` removes that whole class of mismatch.
          if [[ "$BOOTSTRAP_VERSION" == "$RELEASE_TAG" ]]; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          fi
          if python scripts/check-public-client-registry.py npm @crimson-crawler/crimson-crawler-client "${RELEASE_TAG#v}" distribution/*.tgz; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            [[ $status -eq 10 ]] || exit "$status"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # npm trusted publishing cannot create a package's FIRST version — OIDC requires the
      # package to already exist — so the bootstrap branch below is mandatory for it. That
      # branch is gated on `vars.NPM_BOOTSTRAP_VERSION == github.ref_name`, and a stale or
      # unset value does not error: it silently falls through to the OIDC path, which then
      # fails during `publish`, *after* the Python SDK has already published to PyPI and
      # that version is permanently consumed. Fail here, before anything is irreversible.
      - name: Require the bootstrap credential on a first release
        if: steps.registry.outputs.publish == 'true' && steps.registry.outputs.bootstrap != 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BOOTSTRAP_VERSION: ${{ vars.NPM_BOOTSTRAP_VERSION }}
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            https://registry.npmjs.org/@crimson-crawler%2Fcrimson-crawler-client)"
          if [[ "$status" == "200" ]]; then
            echo "Package already exists on the registry; the OIDC path is correct."
            exit 0
          fi
          if [[ "$status" != "404" ]]; then
            echo "::error::Unexpected registry HTTP status $status while checking whether the package exists."
            exit 1
          fi
          # Wording avoids the literal registry-command phrasing on purpose: zizmor's
          # use-trusted-publishing heuristic matches it inside diagnostic text and fails the
          # security gate on a message that performs no upload.
          echo "::error::This tag would create the FIRST version of @crimson-crawler/crimson-crawler-client on the registry, which OIDC cannot do. Set repository variable NPM_BOOTSTRAP_VERSION to exactly ${RELEASE_TAG} (currently '${BOOTSTRAP_VERSION:-unset}'), add NPM_TOKEN to the release environment, then re-run."
          exit 1

  # Gated on `attest`, with no `always()`: if SBOM validation or either attestation
  # failed, the irreversible upload never runs.
  publish:
    name: Publish package
    needs: [build, attest, registry]
    if: needs.registry.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC for npm and Sigstore
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution
          path: distribution
      - name: Bootstrap first npm release
        if: needs.registry.outputs.bootstrap == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          : "${NPM_TOKEN:?NPM_TOKEN is required for the npm bootstrap release}"
          npmrc="${RUNNER_TEMP}/npmrc"
          umask 077
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$npmrc"
          trap 'rm -f "$npmrc"' EXIT
          NPM_CONFIG_USERCONFIG="$npmrc" npm publish ./distribution/*.tgz --access public --provenance
      - name: Publish with trusted publishing
        if: needs.registry.outputs.bootstrap != 'true'
        run: npm publish ./distribution/*.tgz --access public --provenance

  # Confirms the registry now serves files whose digests match the artifacts we attested.
  # `publish` is skipped on an idempotent rerun, and this still runs — comparing against
  # what npm already holds is exactly the check that matters on a rerun.
  verify:
    name: Verify registry files
    needs: [build, attest, registry, publish]
    if: >-
      always() && needs.build.result == 'success' && needs.attest.result == 'success' &&
      needs.registry.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution
          path: distribution
      - name: Verify npm serves the attested artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Exit 0 means every local artifact is present on npm with a matching digest.
          # Exit 10 means something is still missing, which after a publish is a failure.
          python scripts/check-public-client-registry.py \
            npm @crimson-crawler/crimson-crawler-client "${RELEASE_TAG#v}" distribution/*

  release:
    name: Create GitHub release
    needs: [build, attest, registry, publish, verify]
    if: >-
      always() && needs.build.result == 'success' && needs.attest.result == 'success' &&
      needs.registry.result == 'success' && needs.verify.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # Create or verify the immutable GitHub Release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution
          path: release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums
          path: release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: release-assets
      - name: Create or verify release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)" == "false" ]]; then
            mkdir existing
            gh release download "$GITHUB_REF_NAME" --dir existing
            diff <(sha256sum release-assets/* | sed 's#release-assets/##') <(sha256sum existing/* | sed 's#existing/##')
          else
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
              gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "TypeScript SDK $GITHUB_REF_NAME" --generate-notes
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --verify-tag
          fi
