name: Release TypeScript SDK

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          package-manager-cache: false
      - name: Verify tag targets public main
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || {
            echo "Release tag must target the current public main commit." >&2
            exit 1
          }
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node - <<'JS'
          const fs = require("node:fs");
          const tag = process.env.RELEASE_TAG;
          const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== `v${version}`) {
            throw new Error(`Tag ${tag} does not match TypeScript SDK version ${version}`);
          }
          JS
      - name: Build and verify
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          npm ci --no-audit --no-fund
          npm run codegen -- --snapshot-only
          npm run lint
          npm run typecheck
          npm test
          first_pack_dir="$(mktemp -d)"
          second_pack_dir="$(mktemp -d)"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$first_pack_dir" "$second_pack_dir" "$smoke_dir"' EXIT
          npm run build
          npm pack --pack-destination "$first_pack_dir"
          rm -rf dist
          npm run build
          npm pack --pack-destination "$second_pack_dir"
          diff -qr "$first_pack_dir" "$second_pack_dir"
          rm -rf dist
          mkdir dist
          mv "$first_pack_dir"/*.tgz dist/
          python scripts/verify-public-artifacts.py --ts-only
          package_path=("$PWD"/dist/*.tgz)
          tarball="${package_path[0]}"
          npx --yes publint "$tarball"
          # Node 10 predates exports maps; this package requires Node 22 or newer.
          npx --yes @arethetypeswrong/cli --pack "$tarball" --profile node16
          npm install --prefix "$smoke_dir" --ignore-scripts --no-audit --no-fund "${package_path[0]}"
          (
            cd "$smoke_dir"
            node --input-type=module -e \
              'import { CrawlerClient, __version__ } from "@crimson-crawler/crimson-crawler-client"; if (typeof CrawlerClient !== "function" || !__version__) process.exit(1)'
            node -e \
              'const { CrawlerClient, __version__ } = require("@crimson-crawler/crimson-crawler-client"); if (typeof CrawlerClient !== "function" || !__version__) process.exit(1)'
          )
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: cyclonedx-json
          output-file: SBOM.raw.cdx.json
          upload-artifact: false
      - name: Normalize SBOM and write checksums
        run: |
          python scripts/normalize-public-sbom.py SBOM.raw.cdx.json SBOM.cdx.json
          rm SBOM.raw.cdx.json
          for file in dist/* SBOM.cdx.json; do shasum -a 256 "$file"; done | sed 's#  .*/#  #' > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: SBOM.cdx.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  registry:
    name: Check public registry
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution
          path: distribution
      - name: Check npm state
        id: registry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if python scripts/check-public-client-registry.py npm @crimson-crawler/crimson-crawler-client "${RELEASE_TAG#v}" distribution/*.tgz; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            [[ $status -eq 10 ]] || exit "$status"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish package
    needs: [build, registry]
    if: needs.registry.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC for npm and Sigstore
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution
          path: distribution
      - name: Bootstrap first npm release
        if: vars.NPM_BOOTSTRAP_VERSION == github.ref_name
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          : "${NPM_TOKEN:?NPM_TOKEN is required for the npm bootstrap release}"
          npmrc="${RUNNER_TEMP}/npmrc"
          umask 077
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$npmrc"
          trap 'rm -f "$npmrc"' EXIT
          NPM_CONFIG_USERCONFIG="$npmrc" npm publish distribution/*.tgz --access public --provenance
      - name: Publish with trusted publishing
        if: vars.NPM_BOOTSTRAP_VERSION != github.ref_name
        run: npm publish distribution/*.tgz --access public --provenance

  attest:
    name: Attest package artifacts
    needs: [build, registry, publish]
    if: >-
      always() && needs.build.result == 'success' && needs.registry.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write # Sign the GitHub artifact attestation
      attestations: write # Publish the GitHub artifact attestation
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution
          path: distribution
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: distribution/*
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: distribution/*
          sbom-path: sbom/SBOM.cdx.json

  release:
    name: Create GitHub release
    needs: [build, registry, publish, attest]
    if: >-
      always() && needs.build.result == 'success' && needs.registry.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      needs.attest.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # Create or verify the immutable GitHub Release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution
          path: release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums
          path: release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: release-assets
      - name: Create or verify release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)" == "false" ]]; then
            mkdir existing
            gh release download "$GITHUB_REF_NAME" --dir existing
            diff <(sha256sum release-assets/* | sed 's#release-assets/##') <(sha256sum existing/* | sed 's#existing/##')
          else
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
              gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "TypeScript SDK $GITHUB_REF_NAME" --generate-notes
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --verify-tag
          fi
